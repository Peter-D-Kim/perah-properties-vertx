name: Build and Push Vert.x Container

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perah-properties-vertx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repo owner
        run: |
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./perah-properties-vertx
          file: ./perah-properties-vertx/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/perah-properties-vertx:latest
            ghcr.io/${{ env.OWNER }}/perah-properties-vertx:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/perah-properties-vertx:latest
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/perah-properties-vertx:cache,mode=max

      - name: Deploy to Fly.io
        if: ${{ secrets.FLY_API_TOKEN }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy with Fly.io
        if: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd perah-properties-vertx
          flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
